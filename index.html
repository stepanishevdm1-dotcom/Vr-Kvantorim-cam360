<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Тур — Кванториум Третий этаж</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div id="intro-letters" aria-label="Кванториум">
    <span>К</span><span>в</span><span>а</span><span>н</span><span>т</span>
    <span>о</span><span>р</span><span>и</span><span>у</span><span>м</span>
  </div>
  <div id="intro-sub">3D Тур — Третий этаж</div>
  <div id="intro-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>
    <div class="shape s9"></div>
    <div class="shape s10"></div>
    <div class="shape s11"></div>
    <div class="shape s12"></div>
  </div>
</div>

<div id="loading">
  <div id="loading-content">
    <p id="loading-status">Загрузка панорам…</p>
    <p id="loading-speed"></p>
    <p id="loading-hint">Если скорость скачивания медленная — выключите VPN и проверьте сигнал сети</p>
    <div id="preload-list"></div>
    <button id="bg-load-btn">Загружать в фоне</button>
  </div>
</div>

<div id="bg-progress" class="hidden"></div>

<div id="sidebar-btn">☰</div>

<div id="sidebar">
  <div id="sidebar-header">
    <span id="sidebar-title">Комнаты</span>
    <span id="settings-btn" title="Настройки">⚙</span>
  </div>
  <div id="sidebar-list"></div>
  <div id="settings-panel" class="hidden"></div>
</div>

<div id="overlay"></div>

<div id="ui">
  <div id="scene-name"></div>
  <div id="variants"></div>
</div>

<div id="crosshair">+</div>

<script type="module" src="app.js"></script>
</body>
</html>
